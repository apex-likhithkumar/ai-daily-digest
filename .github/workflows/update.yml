name: update-digest
on:
  schedule:
    - cron: '17 */3 * * *' # every 3 hours; GitHub cron is best-effort and can be late
  workflow_dispatch:
  push:
    branches: [main] # redeploy the site when the dashboard code changes

# One run at a time: two overlapping runs could each write feed.json / seen.json and lose items.
concurrency:
  group: digest
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write # push to the data branch
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          ref: data
          path: data

      # A missing file would otherwise read as "empty" and the run would overwrite 30 days of history.
      - name: Check the data branch is set up
        run: |
          test -f data/feed.json && test -f data/seen.json || {
            echo "data branch is missing feed.json or seen.json: see README, 'Create the data branch'"
            exit 1
          }

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci

      - name: Run the pipeline
        run: npm run pipeline
        env:
          DATA_DIR: data
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Commit data (also keeps the repo active so the schedule is not auto-disabled)
        working-directory: data
        run: |
          git config user.name "digest-bot"
          git config user.email "digest-bot@users.noreply.github.com"
          git add -A
          git commit -m "data: update $(date -u +%Y-%m-%dT%H:%MZ)" || echo "nothing to commit"
          git push origin data

      - name: Build the dashboard with the fresh feed
        working-directory: web
        run: |
          npm ci
          cp ../data/feed.json public/feed.json
          npm run build

      - uses: actions/upload-pages-artifact@v3
        with:
          path: web/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
