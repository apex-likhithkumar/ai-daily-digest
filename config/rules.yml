collect:
  maxAgeHours: 72          # raw items older than this are ignored (stops the first run flooding)
cluster:
  similarity: 0.5          # Jaccard overlap of title tokens needed to call two titles the same story
  minSharedTokens: 2
scoring:
  batchSize: 10
  maxLlmItemsPerRun: 60    # protects the free quota; the rest get fallback scores
  delayMs: 4000            # pause between batches (free-tier requests-per-minute limits)
  snippetChars: 300
llm:
  # Tried in order; the first that answers wins. Checked against the providers' official docs on 2026-11-12:
  #  - gemini-2.5-flash is deprecated (API access limited to existing users; routed to 3.5-flash-lite from 2026-12-01).
  #  - llama-3.3-70b-versatile was shut down on Groq on 2026-08-16.
  # Two Gemini models on purpose: free quotas are per model, so when one runs out the next can still answer.
  # Free-tier request/day limits are only shown in AI Studio and the Groq console: re-check them if scoring falls back a lot.
  providers:
    - { type: gemini, model: gemini-3.5-flash-lite }
    - { type: gemini, model: gemini-3.8-flash }
    - { type: groq, model: openai/gpt-oss-120b }
fallback:
  tierImportance: { "1": 6, "2": 4, "3": 3 }
  perExtraSource: 1
  maxExtraSources: 3
  baseRelevance: 2
  perKeywordRelevance: 2
  defaultTopic: F
labels:
  breaking: { minImportance: 8, minSources: 3, maxAgeHours: 6 }
  today: { maxAgeHours: 24 }
  important: { minImportance: 7 }
rank:
  importanceWeight: 0.6
  relevanceWeight: 0.4
  halfLifeHours: 24
retention:
  feedDays: 30
  seenDays: 60
